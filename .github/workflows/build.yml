name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissão mínima no nível do workflow; jobs que precisarem de mais declaram
# explicitamente (SPEC-009).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Falha o build em qualquer warning do compilador, não só do Clippy.
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Gates independentes (SPEC-007). Cada um falha por conta própria, para que o
  # PR mostre *o que* quebrou em vez de "o build falhou".
  # ---------------------------------------------------------------------------

  frontend:
    name: Frontend (lint, test, build)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  rust-format:
    name: Rust format
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust-lint:
    name: Rust lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # O frontend precisa existir: `tauri::generate_context!` lê `../dist`.
      - name: Prepare frontend bundle
        run: |
          npm ci
          npm run build

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    name: Rust tests (offline)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Prepare frontend bundle
        run: |
          npm ci
          npm run build

      # A feature `live-tests` fica de fora de propósito: este gate precisa
      # rodar em máquina sem o Deep Rock Galactic instalado (SPEC-006).
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # 0.22+ é necessário: versões anteriores não interpretam CVSS 4.0 e
      # falham ao carregar a base de advisories atual.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.22"

      # As exceções ficam em `src-tauri/.cargo/audit.toml`, cada uma com
      # justificativa e data de revisão. Vulnerabilidades nunca são ignoradas;
      # um advisory novo fora da lista falha este gate (SPEC-009).
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL (Rust)
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Initialize CodeQL
        if: matrix.language != 'rust'
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

  # ---------------------------------------------------------------------------
  # O artefato só é produzido depois que todos os gates passam (SPEC-007).
  # ---------------------------------------------------------------------------
  build:
    name: Build application
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [frontend, rust-format, rust-lint, rust-test, dependency-audit, codeql]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build -- --no-bundle

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drg-runtime-trainer-${{ github.sha }}
          path: src-tauri/target/release/drg-credits.exe
          if-no-files-found: error
          retention-days: 7
