name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag a publicar (ex.: v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A release passa exatamente pelos mesmos gates do PR (SPEC-007 / SPEC-022).
  # Um artefato nunca é publicado a partir de um commit que não passaria em um
  # pull request.
  gates:
    name: Quality gates
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Frontend gates
        run: |
          npm run lint
          npm test -- --run
          npm run build

      - name: Rust gates
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.22"

      - name: Dependency audit
        run: |
          npm audit --audit-level=high
          cd src-tauri
          cargo audit --deny warnings

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL (Rust)
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Initialize CodeQL
        if: matrix.language != 'rust'
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

  publish:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [gates, codeql]
    permissions:
      # Necessário apenas aqui, e apenas para anexar os artefatos à release.
      contents: write
    env:
      # Promovido a env do job para que o passo de assinatura possa ser
      # condicionado: o contexto `secrets` não é legível em `if` de step.
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build -- --no-bundle

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/drg-credits.exe dist-release/DRG-Runtime-Trainer.exe

      # Manifesto de build (SPEC-011): liga o binário ao commit, à tag e aos
      # perfis de build suportados naquele commit.
      - name: Generate build manifest
        shell: pwsh
        run: |
          $profiles = Select-String -Path src-tauri/src/build_profiles/profiles/*.rs `
            -Pattern 'executable_sha256:\s*"([0-9a-f]{64})"' -AllMatches |
            ForEach-Object { $_.Matches.Groups[1].Value }
          $ids = Select-String -Path src-tauri/src/build_profiles/profiles/*.rs `
            -Pattern '^\s*id:\s*"([^"]+)"' -AllMatches |
            ForEach-Object { $_.Matches.Groups[1].Value }
          $manifest = [ordered]@{
            product       = 'DRG Runtime Trainer'
            tag           = '${{ github.ref_name }}'
            commit        = '${{ github.sha }}'
            builtAt       = (Get-Date).ToUniversalTime().ToString('o')
            workflowRun   = '${{ github.run_id }}'
            signed        = $false
            supportedBuilds = @($ids | ForEach-Object -Begin { $i = 0 } -Process {
                [ordered]@{ profileId = $_; executableSha256 = $profiles[$i]; }
                $i++
              })
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 dist-release/build-manifest.json
          Get-Content dist-release/build-manifest.json

      # Assinatura Authenticode (SPEC-011). O stage já existe para que ligar a
      # assinatura seja adicionar os secrets, não redesenhar o pipeline.
      # Nenhuma chave ou certificado vive no repositório.
      - name: Sign executable
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD `
            /tr $env:TIMESTAMP_URL /td SHA256 dist-release/DRG-Runtime-Trainer.exe
          Remove-Item $certPath -Force
          (Get-Content dist-release/build-manifest.json -Raw) -replace '"signed":\s*false', '"signed": true' |
            Set-Content -Encoding utf8 dist-release/build-manifest.json

      # Checksums gerados pelo CI, não pela máquina de quem publica (SPEC-011).
      - name: Generate checksums
        shell: pwsh
        working-directory: dist-release
        run: |
          Get-ChildItem -File -Exclude SHA256SUMS.txt |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist-release/DRG-Runtime-Trainer.exe dist-release/SHA256SUMS.txt dist-release/build-manifest.json --clobber
